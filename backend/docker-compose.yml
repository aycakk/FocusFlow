services:
  ollama:
    image: ollama/ollama:latest
    container_name: focusflow-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  api:
    build: .
    container_name: focusflow-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL=llama3.2:3b
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
